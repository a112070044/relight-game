<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拾光翻牌挑戰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF1D2; --paper-2:#EFE1B8; --ink:#2E1B12; --ink-soft:#7C6A52;
    --brand:#753122; --brand-soft:#9C5240; --hit:#4C7A4C; --miss:#B4632E;
    --card:#FFFBF0; --card-back:#F3E7C4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#211712; --paper-2:#2B2019; --ink:#F3E7D6; --ink-soft:#C6B49A;
      --card:#2E241C; --card-back:#3A2D22; --brand:#C97A5E; --brand-soft:#E0A088;
    }
  }
  :root[data-theme="dark"]{
    --paper:#211712; --paper-2:#2B2019; --ink:#F3E7D6; --ink-soft:#C6B49A;
    --card:#2E241C; --card-back:#3A2D22; --brand:#C97A5E; --brand-soft:#E0A088;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%; overflow-x:hidden;
  }
  .wrap{max-width:640px;margin:0 auto;padding:26px 18px 60px; position:relative;}
  .brandline{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .brandline img{height:28px; width:auto; display:block;}
  .brandline span{font-family:'Noto Serif TC',serif; font-weight:700; font-size:.95rem; color:var(--brand); letter-spacing:.04em;}
  h1{font-family:'Noto Serif TC',serif; font-weight:700; font-size:1.6rem; margin:6px 0 6px;}
  .sub{color:var(--ink-soft); font-size:.9rem; line-height:1.6; margin:0 0 18px;}

  .diff-row{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  .diff-btn{
    flex:1; min-width:88px; background:var(--card); border:2px solid var(--paper-2);
    border-radius:14px; padding:10px 8px; text-align:center; cursor:pointer;
    font-family:'Noto Sans TC',sans-serif; transition:border-color .15s, transform .15s;
  }
  .diff-btn b{display:block; font-size:.95rem; margin-bottom:2px;}
  .diff-btn span{font-size:.72rem; color:var(--ink-soft);}
  .diff-btn.active{border-color:var(--brand); transform:translateY(-2px);}
  .diff-btn.active b{color:var(--brand);}

  .hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;
       font-size:.95rem; font-weight:700;}
  .timer{color:var(--brand); font-variant-numeric:tabular-nums; transition:color .2s;}
  .timer.calm{color:var(--ink-soft);}
  .timer.urgent{color:#C23B22; animation:tickPulse .5s infinite;}
  @keyframes tickPulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.15);}}
  .moves{color:var(--ink-soft); font-weight:400; font-size:.85rem;}

  .grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
    perspective:800px;
  }
  .card{ aspect-ratio:3/4; cursor:pointer; position:relative; }
  .card-inner{
    width:100%; height:100%; position:relative; transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.4,.2,.2,1);
    border-radius:12px;
  }
  .card.flipped .card-inner, .card.matched .card-inner{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; border-radius:12px; backface-visibility:hidden;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:6px;
  }

    background-size:50% auto;
    border:2px solid var(--paper-2);
    animation:glowPulse 2.6s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{ box-shadow:0 0 0 rgba(117,49,34,0); }
    50%{ box-shadow:0 0 14px 1px color-mix(in srgb, var(--brand) 35%, transparent); }
  }
  .face.front{
    background:var(--card); transform:rotateY(180deg); border:2px solid var(--brand-soft);
    flex-direction:column; gap:4px; font-size:.72rem; line-height:1.3;
  }
  .face.front .emoji{font-size:1.4rem;}
  .card.matched .face.front{
    border-color:var(--hit); background:color-mix(in srgb, var(--hit) 12%, var(--card));
    animation:matchPop .45s ease-out;
  }
  @keyframes matchPop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.14) rotateY(180deg); }
    100%{ transform:scale(1) rotateY(180deg); }
  }
  .card.matched .card-inner{ animation:matchPop .45s ease-out; }

  .confetti-bit{
    position:absolute; top:50%; left:50%; font-size:1rem; pointer-events:none;
    animation:confettiFly .8s ease-out forwards; z-index:5;
  }
  @keyframes confettiFly{
    0%{ transform:translate(-50%,-50%) scale(.6); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot)); opacity:0; }
  }

  .actions{margin-top:22px; display:flex; gap:10px; flex-wrap:wrap;}
  button.primary{
    background:var(--brand); color:#FFF8EC; border:none; border-radius:999px;
    padding:12px 22px; font-size:.95rem; font-weight:700; cursor:pointer;
    font-family:'Noto Sans TC',sans-serif;
  }
  button.primary:disabled{ opacity:.45; cursor:not-allowed; }
  button.ghost{
    background:none; border:1.5px solid var(--ink-soft); color:var(--ink);
    border-radius:999px; padding:12px 22px; font-size:.95rem; cursor:pointer;
    font-family:'Noto Sans TC',sans-serif;
  }

  .overlay{
    display:none; position:fixed; inset:0; background:rgba(30,18,12,.55);
    align-items:center; justify-content:center; padding:20px; z-index:10; overflow:hidden;
  }
  .overlay.show{display:flex;}
  .panel{
    background:var(--paper); border-radius:16px; padding:24px 22px; max-width:480px; width:100%;
    max-height:82vh; overflow-y:auto; border:1px solid var(--paper-2); position:relative; z-index:2;
  }
  .panel h2{font-family:'Noto Serif TC',serif; margin:0 0 6px; color:var(--brand);}
  .panel .stat{color:var(--brand-soft); font-weight:700;}
  .reason{background:var(--card); border-radius:10px; padding:10px 12px; margin-top:8px; font-size:.85rem; line-height:1.6; border:1px solid var(--paper-2);}
  .reason b{color:var(--brand);}
  .closing{margin-top:16px; font-size:.87rem; color:var(--ink-soft); line-height:1.7;}

  .fall-confetti{
    position:absolute; top:-20px; font-size:1.1rem; z-index:1;
    animation:fallDown linear forwards;
  }
  @keyframes fallDown{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(360deg); opacity:.2; }
  }

  @media (max-width:420px){
    .grid{grid-template-columns:repeat(4,1fr); gap:7px;}
    .face.front{font-size:.6rem;}
    .face.front .emoji{font-size:1.1rem;}
  }
</style>
</head>

  <h1>拾光翻牌挑戰</h1>
  <p class="sub">限時翻牌，找出「物品」與「最需要它的人」。翻對配成一組，全部配完看你花了多少時間。</p>

  <div class="diff-row" id="diffRow"></div>

  <div class="hud">
    <span class="timer" id="timer">60</span>
    <span class="moves" id="moves">翻牌次數 0</span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="actions">
    <button class="primary" id="startBtn">開始挑戰</button>
    <button class="ghost" id="resetBtn">重新洗牌</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="resultTitle">結果</h2>
    <p id="resultStat" class="stat"></p>
    <div id="reasons"></div>
    <p class="closing">拾光地圖也是這樣：不只是把「有的」跟「要的」湊在一起，而是理解物品背後的故事，找到真正適合它的下一個主人。</p>
    <div class="actions">
      <button class="primary" id="playAgainBtn">再玩一次</button>
    </div>
  </div>
</div>

<script>
const pool = [
  {id:1, emoji:"\ud83d\udcf7", item:"老相機", need:"想記錄社區故事的攝影新手", reason:"這台相機拍過上百張街角照片，最適合交給也想用鏡頭認識城市的人。"},
  {id:2, emoji:"\ud83d\udeb2", item:"二手腳踏車", need:"剛搬來、還沒有交通工具的上班族", reason:"車況穩定、適合短程通勤，比起收藏，它更需要每天被騎出門。"},
  {id:3, emoji:"\ud83d\udcda", item:"二手教科書", need:"準備轉學考的學弟妹", reason:"書裡有前手的重點筆記，對正在準備考試的人比新書更有價值。"},
  {id:4, emoji:"\ud83c\udfb8", item:"吉他", need:"剛加入熱音社的新生", reason:"閒置的吉他重新被彈響，遠比放在角落積灰塵更貼近它原本的用途。"},
  {id:5, emoji:"\ud83c\udf73", item:"鍋具組", need:"剛獨立租屋的畢業生", reason:"鍋具是租屋族最常缺又最常被忽略的物品，物盡其用的第一站。"},
  {id:6, emoji:"\ud83e\udde5", item:"保暖外套", need:"從南部北上讀書的新生", reason:"外套的保暖需求有季節跟地域性，這正是「地圖」能派上用場的地方。"},
  {id:7, emoji:"\ud83c\udfa8", item:"繪畫用具", need:"想重拾畫筆的社區長輩", reason:"顏料筆刷閒置久了會乾掉，交給真正想動筆的人，材料才不算浪費。"},
  {id:8, emoji:"\ud83d\udef9", item:"滑板", need:"剛搬來想認識鄰里的高中生", reason:"滑板需要場地跟同伴，交給在地新面孔，反而更容易物盡其用。"}
];

const DIFFS = {
  easy:   {label:"簡單", pairs:4, time:90},
  medium: {label:"中等", pairs:6, time:60},
  hard:   {label:"困難", pairs:8, time:45}
};

let currentDiff = 'medium';
let activePairs = [];
let deck = [], flippedCards = [], matchedCount = 0, moves = 0, timeLeft = 60, timerId = null, locked = false;

const wrapEl = document.getElementById('wrap');
const diffRow = document.getElementById('diffRow');
const gridEl = document.getElementById('grid');
const timerEl = document.getElementById('timer');
const movesEl = document.getElementById('moves');
const overlay = document.getElementById('overlay');
const reasonsEl = document.getElementById('reasons');
const resultTitle = document.getElementById('resultTitle');
const resultStat = document.getElementById('resultStat');
const startBtn = document.getElementById('startBtn');

function renderDiffButtons(){
  diffRow.innerHTML = '';
  Object.entries(DIFFS).forEach(([key,cfg])=>{
    const btn = document.createElement('div');
    btn.className = 'diff-btn' + (key===currentDiff?' active':'');
    btn.innerHTML = `<b>${cfg.label}</b><span>${cfg.pairs*2}張・${cfg.time}秒</span>`;
    btn.onclick = ()=>{
      if(timerId) return;
      currentDiff = key;
      newGame();
    };
    diffRow.appendChild(btn);
  });
}

function pickPairs(n){
  return [...pool].sort(()=>Math.random()-0.5).slice(0,n);
}

function buildDeck(){
  const cards = [];
  activePairs.forEach(p=>{
    cards.push({pairId:p.id, kind:'item', label:p.item, emoji:p.emoji});
    cards.push({pairId:p.id, kind:'need', label:p.need, emoji:'\ud83d\udc64'});
  });
  return cards.sort(()=>Math.random()-0.5);
}

function render(){
  gridEl.innerHTML = '';
  deck.forEach((c, idx)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = idx;
    card.innerHTML = `
      <div class="card-inner">
        <div class="face back"></div>
        <div class="face front"><span class="emoji">${c.emoji}</span><span>${c.label}</span></div>
      </div>`;
    card.onclick = ()=>flip(idx);
    gridEl.appendChild(card);
  });
  renderDiffButtons();
}

function spawnConfettiAt(el){
  const bits = ['\u2728','\ud83c\udf89','\ud83d\udc9b','\u2b50'];
  const rect = el.getBoundingClientRect();
  const wrapRect = wrapEl.getBoundingClientRect();
  for(let i=0;i<6;i++){
    const bit = document.createElement('span');
    bit.className = 'confetti-bit';
    bit.textContent = bits[Math.floor(Math.random()*bits.length)];
    const dx = (Math.random()-0.5)*120;
    const dy = -40 - Math.random()*60;
    bit.style.setProperty('--dx', dx+'px');
    bit.style.setProperty('--dy', dy+'px');
    bit.style.setProperty('--rot', (Math.random()*360)+'deg');
    bit.style.left = (rect.left - wrapRect.left + rect.width/2) + 'px';
    bit.style.top = (rect.top - wrapRect.top + rect.height/2) + 'px';
    wrapEl.appendChild(bit);
    setTimeout(()=>bit.remove(), 850);
  }
}

function flip(idx){
  if(locked || !timerId) return;
  const cardEl = gridEl.children[idx];
  if(cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
  if(flippedCards.length===2) return;

  cardEl.classList.add('flipped');
  flippedCards.push(idx);

  if(flippedCards.length===2){
    moves++;
    movesEl.textContent = `翻牌次數 ${moves}`;
    const [a,b] = flippedCards;
    const cardA = deck[a], cardB = deck[b];
    const isMatch = cardA.pairId===cardB.pairId && cardA.kind!==cardB.kind;
    locked = true;
    setTimeout(()=>{
      const elA = gridEl.children[a], elB = gridEl.children[b];
      if(isMatch){
        elA.classList.add('matched'); elB.classList.add('matched');
        spawnConfettiAt(elA); spawnConfettiAt(elB);
        matchedCount++;
        if(matchedCount===activePairs.length) finish(true);
      } else {
        elA.classList.remove('flipped'); elB.classList.remove('flipped');
      }
      flippedCards = [];
      locked = false;
    }, isMatch?400:650);
  }
}

function tick(){
  timeLeft--;
  timerEl.textContent = timeLeft;
  timerEl.classList.toggle('calm', timeLeft>15);
  timerEl.classList.toggle('urgent', timeLeft<=10 && timeLeft>0);
  if(timeLeft<=0){
    clearInterval(timerId); timerId = null;
    finish(false);
  }
}

function launchFallingConfetti(){
  const bits = ['\u2728','\ud83c\udf89','\ud83c\udf8a','\u2b50','\ud83d\udc9b'];
  for(let i=0;i<24;i++){
    const bit = document.createElement('span');
    bit.className = 'fall-confetti';
    bit.textContent = bits[Math.floor(Math.random()*bits.length)];
    bit.style.left = Math.random()*100 + '%';
    bit.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    bit.style.animationDelay = (Math.random()*0.6) + 's';
    overlay.appendChild(bit);
    setTimeout(()=>bit.remove(), 4200);
  }
}

function finish(won){
  clearInterval(timerId); timerId = null;
  const cfg = DIFFS[currentDiff];
  resultTitle.textContent = won ? '全部配對完成！' : '時間到！';
  resultStat.textContent = won
    ? `${cfg.label}難度・花了 ${cfg.time-timeLeft} 秒、翻了 ${moves} 次，配對全部完成`
    : `${cfg.label}難度・配對完成 ${matchedCount} / ${activePairs.length} 組，翻了 ${moves} 次`;
  reasonsEl.innerHTML = '';
  activePairs.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'reason';
    div.innerHTML = `<b>${p.emoji} ${p.item}</b> \u2192 ${p.need}<br>${p.reason}`;
    reasonsEl.appendChild(div);
  });
  overlay.classList.add('show');
  if(won) launchFallingConfetti();
}

function newGame(){
  const cfg = DIFFS[currentDiff];
  activePairs = pickPairs(cfg.pairs);
  deck = buildDeck();
  flippedCards = []; matchedCount = 0; moves = 0; timeLeft = cfg.time; locked = false;
  timerEl.textContent = timeLeft; timerEl.classList.remove('calm','urgent');
  movesEl.textContent = '翻牌次數 0';
  overlay.classList.remove('show');
  overlay.querySelectorAll('.fall-confetti').forEach(el=>el.remove());
  clearInterval(timerId); timerId = null;
  startBtn.disabled = false;
  startBtn.textContent = '開始挑戰';
  render();
}

startBtn.onclick = ()=>{
  if(timerId) return;
  timerId = setInterval(tick, 1000);
  startBtn.textContent = '挑戰中\u2026';
  startBtn.disabled = true;
};

document.getElementById('resetBtn').onclick = newGame;
document.getElementById('playAgainBtn').onclick = newGame;

newGame();
</script>
</body>
</html>
